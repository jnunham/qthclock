<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QTHClock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar"></header>
    <main id="body">
      <section id="map-wrap" class="panel">
        <div id="map"></div>
        <div id="legend">
          <span><i class="ln-me"></i>Station hearing me</span>
          <span><i class="dot-dx"></i>Last QSO / DX</span>
          <span class="muted">colour = band</span>
        </div>
      </section>
      <aside id="side"></aside>
    </main>
  </div>
  <button id="gear" title="Settings" aria-label="Settings">⚙</button>
  <div id="drawer" hidden></div>
  <script type="module" src="dist/main.js"></script>
  <script>
    // Safety net: if the app's code didn't start (e.g. a file failed to
    // load), say so and retry instead of leaving a blank screen.
    setTimeout(function () {
      if (window.qthclockStarted) return;
      var n = Number(sessionStorage.getItem("qthclockRetry") || 0);
      document.getElementById("topbar").innerHTML =
        '<div style="padding:0.5rem 1rem">QTHClock didn\'t start' + (n < 3 ? " — reloading…" : ". Press Ctrl+Shift+R to reload, or check that the QTHClock server is running.") + "</div>";
      if (n < 3) { sessionStorage.setItem("qthclockRetry", n + 1); setTimeout(function () { location.reload(); }, 3000); }
    }, 8000);
  </script>
</body>
</html>
